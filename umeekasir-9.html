<body>

<div class="header">

<script>
// ══════════════════════════════════════════════════════
// KONFIGURASI
// ══════════════════════════════════════════════════════
const QRIS_STATIC = "00020101021126580006id.ovo01189360091200015960230215L3FKFurqtVkL6vl0303UMI51450015ID.OR.GPNQR.WWW0215ID10221848498940303UMI5204581253033605802ID5908UmeePiza6006Bekasi61051753062310507lOqAXgB0716VWyFMpvWopvwFkrc6304A7F0";
const BANK_NAME   = "Bank BSI";
const BANK_NOREK  = "7193100249";
const BANK_AN     = "Nita Ratna Fitriasari";

const MENU = [
  { id:1, name:"Smoked Beef Pizza",     price:50000, emoji:"🍕" },
  { id:2, name:"Pepperoni Pizza",       price:50000, emoji:"🍕" },
  { id:3, name:"Beef Sausage Pizza",    price:50000, emoji:"🍕" },
  { id:4, name:"Chicken Sausage Pizza", price:50000, emoji:"🍕" },
  { id:5, name:"Double Cheese Pizza",   price:50000, emoji:"🍕" },
  { id:6, name:"Umee Donuts",           price:5000,  emoji:"🍩" },
];

// ══════════════════════════════════════════════════════
// QRIS DINAMIS — EMVCo / BI QRIS spec
// Base string ini TIDAK mengandung tag 6304 (CRC) di akhir.
// Kita insert tag 54 (amount) + ubah tag 01 ke "12" (dynamic)
// lalu append "6304" + CRC-16 CCITT baru.
// ══════════════════════════════════════════════════════
function crc16ccitt(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc;
}

function buildQRISDynamic(base, amount) {
  // Base berakhir "6304XXXX" — strip 8 char terakhir, modifikasi, hitung CRC baru.

  // 1. Strip "6304XXXX" (last 8 chars)
  let s = base.slice(0, -8);

  // 2. Ubah tag 01: "010211" (static) → "010212" (dynamic)
  s = s.replace("010211", "010212");

  // 3. Buat tag 54 (Transaction Amount), e.g. "540850000.00"
  const amtStr = amount.toFixed(2);
  const tag54  = "54" + String(amtStr.length).padStart(2, "0") + amtStr;

  // 4. Sisipkan tag 54 SEBELUM tag 58 ("5802ID")
  const pos = s.indexOf("5802ID");
  s = pos !== -1 ? s.slice(0, pos) + tag54 + s.slice(pos) : s + tag54;

  // 5. Append "6304" + CRC-16 CCITT baru
  s += "6304";
  const crc = crc16ccitt(s);
  s += crc.toString(16).toUpperCase().padStart(4, "0");

  return s;
}

// ══════════════════════════════════════════════════════
// BLUETOOTH THERMAL PRINTER
// ══════════════════════════════════════════════════════
// Common UUIDs for thermal printers (XPrinter, MTP, RPP, etc.)
const BT_SERVICE_UUIDS = [
  "000018f0-0000-1000-8000-00805f9b34fb",   // common thermal (most popular)
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2",   // XPrinter
  "49535343-fe7d-4ae5-8fa9-9fafd205e455",   // Microchip BM70
  "00001101-0000-1000-8000-00805f9b34fb",   // SPP serial
];

const BT_CHAR_UUIDS = [
  "00002af1-0000-1000-8000-00805f9b34fb",
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
  "49535343-8841-43f4-a8d4-ecbe34729bb3",
  "00002a56-0000-1000-8000-00805f9b34fb",
];

let btDevice     = null;
let btChar       = null;
let btLastName   = localStorage.getItem("bt_last_name") || null;  // nama device terakhir
let btReconnectTimer = null;

// ── Auto-reconnect saat halaman load ──
async function btAutoConnect() {
  if (!navigator.bluetooth) return;
  try {
    const devices = await navigator.bluetooth.getDevices();
    // Prioritaskan device dengan nama yang tersimpan (RPP02N, dll)
    const sorted = btLastName
      ? [...devices].sort((a,b) => (a.name===btLastName ? -1 : b.name===btLastName ? 1 : 0))
      : devices;
    for (const dev of sorted) {
      try {
        setBtUI("connecting", dev.name);
        await btDoConnect(dev);
        return;
      } catch(e) { /* coba device berikutnya */ }
    }
    // Tidak ada yang bisa diconnect — tampilkan tombol reconnect jika ada history
    if (btLastName) setBtUI("off");
  } catch(e) {
    if (btLastName) setBtUI("off");
  }
}

// ── Klik tombol BT ──
async function btConnect() {
  // Sudah terhubung → disconnect
  if (btChar && btDevice?.gatt?.connected) {
    btDevice.gatt.disconnect();
    return;
  }

  // Ada device terakhir → coba reconnect langsung tanpa dialog
  if (btLastName && btDevice) {
    try {
      setBtUI("connecting", btLastName);
      await btDoConnect(btDevice);
      return;
    } catch(e) { /* gagal, lanjut ke dialog pilih */ }
  }

  if (!navigator.bluetooth) {
    showToast("❌ Browser tidak support Web Bluetooth. Gunakan Chrome desktop.");
    return;
  }

  // Coba getDevices() dulu (tanpa dialog, untuk paired devices)
  try {
    const paired = await navigator.bluetooth.getDevices();
    if (paired.length) {
      setBtUI("connecting");
      for (const dev of paired) {
        try { await btDoConnect(dev); return; } catch(e) {}
      }
    }
  } catch(e) {}

  // Fallback: buka dialog scan
  try {
    setBtUI("connecting");
    const dev = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: BT_SERVICE_UUIDS,
    });
    await btDoConnect(dev);
  } catch(e) {
    setBtUI("off");
    if (e.name !== "NotFoundError") showToast("❌ " + e.message);
    else showToast("Pencarian dibatalkan");
  }
}

async function btDoConnect(dev) {
  btDevice = dev;

  // Hapus listener lama agar tidak double
  dev.removeEventListener("gattserverdisconnected", btOnDisconnect);
  dev.addEventListener("gattserverdisconnected", btOnDisconnect);

  const server = await dev.gatt.connect();

  // Coba tiap service UUID yang dikenal
  let service = null;
  for (const uuid of BT_SERVICE_UUIDS) {
    try { service = await server.getPrimaryService(uuid); break; } catch(e) {}
  }
  if (!service) {
    const svcs = await server.getPrimaryServices();
    if (!svcs.length) throw new Error("Tidak ada service ditemukan");
    service = svcs[0];
  }

  // Cari characteristic writable
  const chars = await service.getCharacteristics();
  btChar = null;
  for (const ch of chars) {
    if (ch.properties.write || ch.properties.writeWithoutResponse) {
      btChar = ch; break;
    }
  }
  if (!btChar) {
    for (const uuid of BT_CHAR_UUIDS) {
      try { btChar = await service.getCharacteristic(uuid); break; } catch(e) {}
    }
  }
  if (!btChar) throw new Error("Characteristic write tidak ditemukan");

  // Simpan nama untuk reconnect berikutnya
  btLastName = dev.name || "Printer";
  localStorage.setItem("bt_last_name", btLastName);

  setBtUI("on");
  showToast("✅ Terhubung: " + btLastName);
}

function btOnDisconnect() {
  btChar = null;
  setBtUI("off");
  showToast("📵 " + (btLastName || "Printer") + " terputus — tap untuk reconnect");

  // Auto-retry reconnect setelah 3 detik (maks 5 kali)
  btScheduleReconnect(3000, 5);
}

let _btRetryCount = 0;
function btScheduleReconnect(delayMs, maxRetries) {
  if (_btRetryCount >= maxRetries) { _btRetryCount = 0; return; }
  clearTimeout(btReconnectTimer);
  btReconnectTimer = setTimeout(async () => {
    if (btChar && btDevice?.gatt?.connected) return; // sudah connect dari luar
    if (!btDevice) return;
    _btRetryCount++;
    setBtUI("connecting", btLastName);
    try {
      await btDoConnect(btDevice);
      _btRetryCount = 0;
    } catch(e) {
      setBtUI("off");
      // Retry lagi dengan backoff
      btScheduleReconnect(Math.min(delayMs * 1.5, 15000), maxRetries);
    }
  }, delayMs);
}

async function btPrint(data) {
  if (!btChar) { showToast("⚠️ Printer belum terhubung"); return; }
  try {
    showToast("⏳ Menyiapkan struk...");
    const bytes = await escpos(data);
    const CHUNK = 128; // lebih kecil agar stabil untuk bitmap besar
    for (let i = 0; i < bytes.length; i += CHUNK) {
      const chunk = bytes.slice(i, i + CHUNK);
      if (btChar.properties.writeWithoutResponse) {
        await btChar.writeValueWithoutResponse(chunk);
      } else {
        await btChar.writeValue(chunk);
      }
      await new Promise(r => setTimeout(r, 30)); // small delay between chunks
    }
    showToast("✅ Struk berhasil dicetak!");
  } catch(e) {
    console.error(e);
    showToast("❌ Gagal cetak: " + e.message);
  }
}

// ══════════════════════════════════════════════════════
// QZ TRAY INTEGRATION
// ══════════════════════════════════════════════════════
// QZ Tray adalah desktop app ringan (Windows/Mac/Linux) yang
// memungkinkan web app mengirim perintah cetak ke printer
// USB, Serial, atau LAN via JavaScript API.
// Download: https://qz.io/download/
//
// CARA KERJA:
//  1. User install QZ Tray di komputer kasir.
//  2. Klik tombol "QZ" di header untuk connect.
//  3. Pilih nama printer dari dialog.
//  4. Klik "🖥️ QZ Print" di struk untuk cetak.
//
// SIGNATURE:
//  Untuk produksi, gunakan sertifikat + private key dari QZ.
//  Untuk testing/LAN lokal, kita gunakan mode unsigned
//  (QZ Tray akan menampilkan dialog konfirmasi sekali).

let qzConnected   = false;
let qzPrinterName = null;

// Override sertifikat — gunakan null untuk unsigned (testing)
// Untuk produksi, isi dengan sertifikat dari https://qz.io/
async function qzSetCertificate() {
  // Kosongkan untuk unsigned (QZ Tray akan prompt user sekali)
  qz.security.setCertificatePromise(function(resolve) {
    resolve("-----IGNORED-----");  // bypass sertifikat untuk testing
  });
  qz.security.setSignatureAlgorithm("SHA512");
  qz.security.setSignaturePromise(function(toSign) {
    return function(resolve) {
      resolve(null); // unsigned — QZ Tray tampilkan warning sekali
    };
  });
}

async function qzConnect() {
  if (qzConnected) {
    // Disconnect
    try { await qz.websocket.disconnect(); } catch(e) {}
    qzConnected   = false;
    qzPrinterName = null;
    setQzUI("off");
    showToast("🖥️ QZ Tray terputus");
    return;
  }

  if (typeof qz === "undefined") {
    showToast("❌ Library QZ Tray tidak termuat. Periksa koneksi internet.");
    return;
  }

  try {
    setQzUI("connecting");
    await qzSetCertificate();

    // Connect ke QZ Tray (harus sudah berjalan di komputer)
    await qz.websocket.connect({ retries: 2, delay: 1 });
    qzConnected = true;

    // Ambil daftar printer yang tersedia
    const printers = await qz.printers.find();
    if (!printers || !printers.length) {
      showToast("⚠️ Tidak ada printer ditemukan di QZ Tray");
      setQzUI("off");
      return;
    }

    // Auto-pilih printer thermal jika ada, atau pilih pertama
    const thermalKeywords = ["thermal","receipt","pos","epson","star","xp","cashier","kasir","printer"];
    const autoSelected = printers.find(p =>
      thermalKeywords.some(k => p.toLowerCase().includes(k))
    ) || printers[0];

    // Tampilkan pilihan printer ke user
    const chosen = await promptPrinterChoice(printers, autoSelected);
    if (!chosen) {
      setQzUI("off");
      qzConnected = false;
      await qz.websocket.disconnect();
      return;
    }

    qzPrinterName = chosen;
    setQzUI("on");
    showToast("✅ QZ Tray: " + chosen);

  } catch(e) {
    setQzUI("off");
    qzConnected = false;
    if (e && e.message && e.message.includes("Unable to establish")) {
      showToast("❌ QZ Tray belum berjalan. Download & jalankan dulu: qz.io");
    } else {
      showToast("❌ QZ Tray: " + (e.message || e));
    }
  }
}

async function qzPrint(data) {
  if (!qzConnected || !qzPrinterName) {
    showToast("⚠️ QZ Tray belum terhubung. Klik tombol QZ di header.");
    return;
  }
  if (typeof qz === "undefined") {
    showToast("❌ Library QZ Tray tidak tersedia");
    return;
  }

  try {
    showToast("⏳ Menyiapkan struk...");
    const bytes = await escpos(data);

    // Konversi Uint8Array ke array of hex strings untuk QZ Tray
    // QZ Tray menerima format: [{type:'raw', format:'hex', data:'...'}]
    // atau array of bytes langsung via Uint8Array
    const config = qz.configs.create(qzPrinterName, {
      encoding: "RAW",
      copies: 1,
    });

    // Kirim sebagai raw bytes (ESC/POS)
    const data64 = btoa(String.fromCharCode(...bytes));
    await qz.print(config, [{
      type   : "raw",
      format : "base64",
      data   : data64,
    }]);

    showToast("✅ QZ Tray: Struk berhasil dicetak!");
  } catch(e) {
    console.error("QZ Print error:", e);
    showToast("❌ QZ Print gagal: " + (e.message || e));
  }
}

// ══════════════════════════════════════════════════════
// QR → ESC/POS BITMAP (GS v 0) — bekerja di semua printer
// ══════════════════════════════════════════════════════
function qrToBitmap(qrisStr, size) {
  return new Promise((resolve, reject) => {
    // QRCode.js butuh div container, lalu membuat canvas di dalamnya
    const div = document.createElement("div");
    div.style.cssText = "position:fixed;left:-9999px;top:-9999px;visibility:hidden";
    document.body.appendChild(div);

    new QRCode(div, {
      text         : qrisStr,
      width        : size,
      height       : size,
      correctLevel : QRCode.CorrectLevel.M,
    });

    setTimeout(() => {
      try {
        // QRCode.js render ke <canvas> atau <img> di dalam div
        const canvas = div.querySelector("canvas");
        if (!canvas) throw new Error("Canvas tidak ditemukan");

        const ctx = canvas.getContext("2d");
        const w   = canvas.width;
        const h   = canvas.height;
        const img = ctx.getImageData(0, 0, w, h);
        const px  = img.data;

        const byteW = Math.ceil(w / 8);
        const rows  = [];

        for (let y = 0; y < h; y++) {
          const row = new Array(byteW).fill(0);
          for (let x = 0; x < w; x++) {
            const i    = (y * w + x) * 4;
            const r    = px[i], g = px[i+1], b2 = px[i+2], a = px[i+3];
            // Pixel transparan atau putih = background; gelap = modul QR
            const lum  = (r * 299 + g * 587 + b2 * 114) / 1000;
            const dark = a > 10 && lum < 128;
            if (dark) row[Math.floor(x/8)] |= (0x80 >> (x % 8));
          }
          rows.push(row);
        }

        document.body.removeChild(div);

        // GS v 0: raster bitmap
        const xL = byteW & 0xFF;
        const xH = (byteW >> 8) & 0xFF;
        const yL = h & 0xFF;
        const yH = (h >> 8) & 0xFF;
        const cmd = [0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH];
        for (const row of rows) cmd.push(...row);

        resolve(new Uint8Array(cmd));
      } catch(e) {
        try { document.body.removeChild(div); } catch(_) {}
        reject(e);
      }
    }, 200);
  });
}

// ══════════════════════════════════════════════════════
// TEXT → ESC/POS BITMAP — untuk karakter non-ASCII (Jepang, dll)
// ══════════════════════════════════════════════════════
function textToBitmap(text, opts = {}) {
  return new Promise((resolve) => {
    const fontSize  = opts.fontSize  || 20;
    const fontFace  = opts.fontFace  || "16px sans-serif";
    const paperW    = opts.paperW    || 384; // dot width kertas 58mm

    // Ukur lebar teks dulu
    const measure = document.createElement("canvas");
    const mctx    = measure.getContext("2d");
    mctx.font     = fontFace;
    const tw      = Math.ceil(mctx.measureText(text).width) + 8;
    const th      = fontSize + 8;

    const canvas  = document.createElement("canvas");
    canvas.width  = paperW;
    canvas.height = th;
    const ctx     = canvas.getContext("2d");

    // Background putih
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, paperW, th);

    // Teks hitam, tengah
    ctx.fillStyle = "#000";
    ctx.font      = fontFace;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, paperW / 2, th / 2);

    // Canvas → 1-bit bitmap
    const img   = ctx.getImageData(0, 0, paperW, th);
    const px    = img.data;
    const byteW = Math.ceil(paperW / 8);
    const rows  = [];

    for (let y = 0; y < th; y++) {
      const row = new Array(byteW).fill(0);
      for (let x = 0; x < paperW; x++) {
        const i   = (y * paperW + x) * 4;
        const lum = (px[i]*299 + px[i+1]*587 + px[i+2]*114) / 1000;
        if (lum < 128 && px[i+3] > 10) row[Math.floor(x/8)] |= (0x80 >> (x%8));
      }
      rows.push(row);
    }

    const xL = byteW & 0xFF, xH = (byteW >> 8) & 0xFF;
    const yL = th & 0xFF,    yH = (th >> 8) & 0xFF;
    const cmd = [0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH];
    for (const row of rows) cmd.push(...row);

    resolve(new Uint8Array(cmd));
  });
}

async function escpos(d) {
  const b = [];
  const E=0x1B, G=0x1D, N=0x0A;

  const raw  = (...x) => b.push(...x);
  const lf   = ()     => b.push(N);
  const txt  = s      => { for(const c of s) b.push(c.charCodeAt(0) & 0xFF); };
  const cen  = ()     => raw(E,0x61,0x01);
  const lft  = ()     => raw(E,0x61,0x00);
  const bold = v      => raw(E,0x45,v?1:0);
  const big  = v      => raw(G,0x21,v?0x11:0x00);
  const dash = (n=32) => '-'.repeat(n);
  const col2 = (a,b2,w=32) => {
    const sp = Math.max(1, w - a.length - b2.length);
    return a + ' '.repeat(sp) + b2;
  };

  raw(E,0x40);      // init
  raw(E,0x74,0x00); // codepage PC437

  // HEADER
  cen(); bold(true); big(true);
  txt("Umee!Bakehouse"); lf();
  big(false); bold(false);
  // Render teks Jepang sebagai bitmap (printer tidak support Unicode)
  const jpBmp = await textToBitmap("うまいベークハウス", {
    fontSize: 22, fontFace: "bold 22px sans-serif", paperW: 384
  });
  b.push(...jpBmp);
  txt("Telp: 0851-6296-1050"); lf();
  txt(dash()); lf();

  // META
  lft();
  txt("Nama   : " + d.nama); lf();
  txt("Tgl    : " + d.dateStr); lf();
  txt("Jam    : " + d.timeStr); lf();
  txt("Struk  : " + d.inv); lf();
  txt("Metode : " + d.pm); lf();
  txt(dash()); lf();

  // ITEMS
  for (const item of d.items) {
    txt(item.name.substring(0,24)); lf();
    txt(col2("  " + item.price.toLocaleString("id-ID") + " x" + item.qty,
             (item.price*item.qty).toLocaleString("id-ID"))); lf();
  }
  txt(dash()); lf();

  // TOTALS
  txt(col2("Subtotal", d.sub.toLocaleString("id-ID"))); lf();
  if (d.disc > 0) {
    txt(col2("Diskon", "-" + d.disc.toLocaleString("id-ID"))); lf();
  }
  bold(true);
  txt(col2("TOTAL (" + d.qty + " produk)", d.tot.toLocaleString("id-ID"))); lf();
  bold(false);
  txt(dash()); lf();

  // PAYMENT DETAIL
  if (d.pm === "Tunai") {
    txt(col2("Bayar",    d.paidAmt.toLocaleString("id-ID"))); lf();
    txt(col2("Kembali",  d.chg.toLocaleString("id-ID"))); lf();
  } else if (d.pm === "Transfer") {
    cen();
    txt("-- Transfer ke --"); lf();
    bold(true); txt(BANK_NAME); lf();
    txt(BANK_NOREK); lf(); bold(false);
    txt("a/n " + BANK_AN); lf();
    bold(true); txt("Rp " + d.tot.toLocaleString("id-ID")); lf(); bold(false);
    lft();
  } else if (d.pm === "QRIS") {
    cen();
    txt("-- Bayar via QRIS --"); lf();
    lf();

    // ── Render QR ke bitmap lalu kirim via GS v 0 ──
    try {
      const qrisStr = buildQRISDynamic(QRIS_STATIC, d.tot);
      // 384px = lebar penuh kertas 58mm (8 dot/mm × 48mm area cetak)
      // Kirim dalam chunk lebih kecil (sudah dihandle btPrint)
      const bitmapCmd = await qrToBitmap(qrisStr, 384);
      b.push(...bitmapCmd);
    } catch(e) {
      // Fallback ke teks jika bitmap gagal
      txt("(QR gagal render)"); lf();
    }

    lf();
    bold(true); txt("Rp " + d.tot.toLocaleString("id-ID")); lf(); bold(false);
    txt("Scan untuk membayar"); lf();
    lft();
  }
  txt(dash()); lf();

  // FOOTER
  cen();
  txt("Terimakasih!"); lf();
  txt("Jazaakumullahu Khayran"); lf();
  txt("IG: umee.bakehouse"); lf();
  lf(); lf(); lf();

  raw(G,0x56,0x42,0x00); // full cut

  return new Uint8Array(b);
}

    <div class="card">
      <div class="card-label">NAMA PEMESAN</div>
      <input class="card-input" type="text" placeholder="Nama pelanggan..." id="namaInp"
        value="${namaPemesan}" oninput="namaPemesan=this.value"/>
    </div>

    <div class="card">
      <div class="card-label">DISKON (Rp)</div>
      <input class="card-input" type="number" placeholder="0" id="discInp" value="${discount||''}"
        oninput="discount=parseInt(this.value)||0;renderCart();renderFooter()"/>
    </div>

    <div class="card">
      <div class="card-label">METODE BAYAR</div>
      <div class="pay-methods">
        ${["Tunai","Transfer","QRIS"].map(m=>`
          <button class="pay-btn ${payMethod===m?'active':''}" onclick="setPayMethod('${m}')">${m}</button>`
        ).join("")}
      </div>
      ${payMethod==="Transfer" ? `
        <div class="transfer-box">
          <div class="transfer-bank">${BANK_NAME}</div>
          <div class="transfer-norek">${BANK_NOREK}</div>
          <div class="transfer-an">a/n ${BANK_AN}</div>
        </div>` : ""}
    </div>

    ${payMethod==="Tunai" ? `
      <div class="card">
        <div class="card-label">UANG DITERIMA</div>
        <input class="card-input" type="number" placeholder="0" id="cashInp" value="${cashInput||''}"
          oninput="cashInput=parseInt(this.value)||0;renderCart();renderFooter()"/>
        <div class="quick-cash" id="quickCash"></div>
      </div>` : ""}

    <div class="total-box">
      <div class="total-row"><span class="label">Subtotal</span><span class="val">${fmt(subtotal())}</span></div>
      ${discount>0?`<div class="total-row discount"><span class="label">Diskon</span><span class="val">−${fmt(discount)}</span></div>`:""}
      <div class="total-main"><span>Total</span><span>${fmt(total())}</span></div>
      ${payMethod==="Tunai"&&cashInput>=total()&&total()>0?`
        <div class="total-change"><span class="label">Kembalian</span><span class="val">${fmt(change())}</span></div>`:""}
    </div>`;

  if (payMethod === "Tunai") {
    const t = total();
    const chips = [...new Set([t, Math.ceil(t/10000)*10000, Math.ceil(t/50000)*50000, 200000].filter(v=>v>0))].slice(0,4);
    const qc = document.getElementById("quickCash");
    if (qc) qc.innerHTML = chips.map(v=>
      `<button class="cash-chip ${cashInput==v?'active':''}" onclick="setCash(${v})">${v.toLocaleString("id-ID")}</button>`
    ).join("");
  }
}

function renderFooter() {
  const mf = document.getElementById("menuFooter");
  const cf = document.getElementById("cartFooter");
  if (currentTab === "menu") {
    cf.style.display = "none";
    if (totalQty() > 0) {
      mf.style.display = "block";
      document.getElementById("menuFooterBtn").textContent =
        `🛒 Lihat Pesanan (${totalQty()} item) — ${fmt(subtotal())}`;
    } else {
      mf.style.display = "none";
    }
  } else {
    mf.style.display = "none";
    if (cart.length > 0) {
      cf.style.display = "block";
      const btn = document.getElementById("checkoutBtn");
      btn.textContent = `🧾 Bayar & Cetak Struk — ${fmt(total())}`;
      btn.disabled = !canPay();
    } else {
      cf.style.display = "none";
    }
  }
  document.getElementById("tabCart").textContent =
    totalQty() > 0 ? `🛒  Pesanan (${totalQty()})` : "🛒  Pesanan";
}

function render() { renderMenu(); renderCart(); renderFooter(); }

// ── Actions ──
function addItem(id) {
  const item = MENU.find(m => m.id === id);
  const ex   = cart.find(c => c.id === id);
  cart = ex ? cart.map(c => c.id===id ? {...c,qty:c.qty+1} : c)
             : [...cart, {...item,qty:1}];
  render();
}
function changeQty(id, d) {
  cart = cart.map(c => c.id===id ? {...c,qty:c.qty+d} : c).filter(c=>c.qty>0);
  render();
}
function setCash(v) { cashInput = v; renderCart(); renderFooter(); }
function setPayMethod(m) { payMethod = m; cashInput = 0; renderCart(); renderFooter(); }

// ══════════════════════════════════════════════════════
// CHECKOUT
// ══════════════════════════════════════════════════════
function checkout() {
  if (!canPay()) return;

  const now     = new Date();
  const dateStr = now.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  const timeStr = now.toTimeString().slice(0,8);
  const inv     = genInv();
  const sub     = subtotal();
  const tot     = total();
  const disc    = discount;
  const paidAmt = payMethod === "Tunai" ? cashInput : tot;
  const chg     = Math.max(0, paidAmt - tot);
  const qty     = totalQty();
  const items   = [...cart];
  const pm      = payMethod;
  const nama    = namaPemesan.trim() || "—";

  window._receipt = { dateStr, timeStr, inv, sub, tot, disc, paidAmt, chg, qty, items, pm, nama };

  // Build QRIS / Transfer section
  let payBlock = "";
  if (pm === "QRIS") {
    payBlock = `
      <div class="r-qris">
        <div class="r-qris-label">Scan QRIS untuk Membayar</div>
        <div class="qris-wrap" id="qrisWrap"></div>
        <div class="r-qris-amount">Rp ${tot.toLocaleString("id-ID")}</div>
        <div class="r-qris-note">QRIS dinamis · berlaku sekali · UmeePiza</div>
      </div>`;
  } else if (pm === "Transfer") {
    payBlock = `
      <div class="r-transfer">
        <div class="r-transfer-lbl">Transfer ke Rekening</div>
        <div class="r-transfer-bank">${BANK_NAME}</div>
        <div class="r-transfer-norek">${BANK_NOREK}</div>
        <div class="r-transfer-an">a/n ${BANK_AN}</div>
        <div class="r-transfer-nom">Nominal: Rp ${tot.toLocaleString("id-ID")}</div>
      </div>`;
  }

  document.getElementById("receiptBox").innerHTML = `
    <div class="r-header">
      <div class="r-logo">🥐</div>
      <div class="r-store">Umee! Bakehouse</div>
      <div class="r-ja">うまいベークハウス</div>
      <div class="r-phone">0851-6296-1050</div>
    </div>
    <div class="r-meta">
      <div class="r-row"><span class="k">Pemesan</span><span>${nama}</span></div>
      <div class="r-row"><span class="k">Tanggal</span><span>${dateStr}</span></div>
      <div class="r-row"><span class="k">Jam</span><span>${timeStr}</span></div>
      <div class="r-row"><span class="k">No. Struk</span><span>${inv}</span></div>
      <div class="r-row"><span class="k">Pembayaran</span><span>${pm}</span></div>
    </div>
    <div class="r-items">
      ${items.map(item=>`
        <div class="r-item">
          <div class="r-item-name">${item.name}</div>
          <div class="r-item-row">
            <span>${item.price.toLocaleString("id-ID")} × ${item.qty}</span>
            <span>${(item.price*item.qty).toLocaleString("id-ID")}</span>
          </div>
        </div>`).join("")}
    </div>
    <div class="r-totals">
      <div class="r-total-row"><span>Subtotal</span><span>${sub.toLocaleString("id-ID")}</span></div>
      ${disc>0?`<div class="r-total-row disc"><span>Diskon</span><span>−${disc.toLocaleString("id-ID")}</span></div>`:""}
      <div class="r-total-row bold"><span>Total (${qty} Produk)</span><span>${tot.toLocaleString("id-ID")}</span></div>
    </div>
    ${pm==="Tunai"?`
    <div class="r-pay">
      <div class="r-pay-row"><span>Bayar</span><span>${paidAmt.toLocaleString("id-ID")}</span></div>
      <div class="r-pay-row"><span>Kembali</span><span>${chg.toLocaleString("id-ID")}</span></div>
    </div>`:""}
    ${payBlock}
    <div class="r-footer">
      <div>Terimakasih</div>
      <div>Jazaakumullahu Khayran</div>
      <div class="ig">IG umee.bakehouse</div>
    </div>
    <div class="r-actions">
      <button class="r-btn print" onclick="window.print()">🖨️ Print</button>
      <button class="r-btn bt" id="btPrintBtn"
        ${btChar?'':"disabled"}
        onclick="btPrint(window._receipt)">📱 BT Print</button>
      <button class="r-btn share" onclick="shareStruk(window._receipt)">📤 Bagikan</button>
      <button class="r-btn close" onclick="closeReceipt()">✕ Tutup</button>
    </div>`;

  document.getElementById("receiptOverlay").style.display = "flex";

  // Generate QRIS QR Code
  if (pm === "QRIS") {
    setTimeout(() => {
      const wrap = document.getElementById("qrisWrap");
      if (!wrap) return;
      const qrisStr = buildQRISDynamic(QRIS_STATIC, tot);
      new QRCode(wrap, {
        text: qrisStr,
        width: 176,
        height: 176,
        correctLevel: QRCode.CorrectLevel.M,
      });
    }, 80);
  }

  // Reset state
  cart=[]; discount=0; cashInput=0; payMethod="Tunai"; namaPemesan="";
  switchTab("menu");
}

// ── Share Struk ──
async function shareStruk(d) {
  // Susun teks struk yang rapi untuk WA / pesan
  const lines = [];
  lines.push("🥐 *Umee! Bakehouse*");
  lines.push("うまいベークハウス");
  lines.push("Telp: 0851-6296-1050");
  lines.push("─────────────────────");
  lines.push(`Pemesan : ${d.nama || "—"}`);
  lines.push(`Tanggal : ${d.dateStr}`);
  lines.push(`Jam     : ${d.timeStr}`);
  lines.push(`No.Struk: ${d.inv}`);
  lines.push(`Metode  : ${d.pm}`);
  lines.push("─────────────────────");
  for (const item of d.items) {
    lines.push(`${item.name}`);
    lines.push(`  Rp ${item.price.toLocaleString("id-ID")} × ${item.qty}  =  Rp ${(item.price*item.qty).toLocaleString("id-ID")}`);
  }
  lines.push("─────────────────────");
  lines.push(`Subtotal : Rp ${d.sub.toLocaleString("id-ID")}`);
  if (d.disc > 0) lines.push(`Diskon   : −Rp ${d.disc.toLocaleString("id-ID")}`);
  lines.push(`*TOTAL   : Rp ${d.tot.toLocaleString("id-ID")}*`);
  if (d.pm === "Tunai") {
    lines.push(`Bayar    : Rp ${d.paidAmt.toLocaleString("id-ID")}`);
    lines.push(`Kembali  : Rp ${d.chg.toLocaleString("id-ID")}`);
  } else if (d.pm === "Transfer") {
    lines.push("─────────────────────");
    lines.push(`Transfer ke: *${BANK_NAME}*`);
    lines.push(`No. Rek: *${BANK_NOREK}*`);
    lines.push(`a/n ${BANK_AN}`);
    lines.push(`Nominal: *Rp ${d.tot.toLocaleString("id-ID")}*`);
  } else if (d.pm === "QRIS") {
    lines.push("─────────────────────");
    lines.push("Bayar via *QRIS*");
    lines.push(`Nominal: *Rp ${d.tot.toLocaleString("id-ID")}*`);
    lines.push("(Scan QR di struk layar)");
  }
  lines.push("─────────────────────");
  lines.push("Terimakasih! 🙏");
  lines.push("_Jazaakumullahu Khayran_");
  lines.push("IG: @umee.bakehouse");

  const text = lines.join("\n");

  // Gunakan Web Share API jika tersedia (Android Chrome, iOS Safari)
  if (navigator.share) {
    try {
      await navigator.share({
        title: `Struk Umee! Bakehouse — ${d.inv}`,
        text : text,
      });
    } catch(e) {
      if (e.name !== "AbortError") {
        // Fallback: copy ke clipboard
        copyToClipboard(text);
      }
    }
  } else {
    // Fallback untuk browser yang tidak support Share API
    copyToClipboard(text);
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast("📋 Struk disalin! Paste ke WA atau pesan lainnya.");
  }).catch(() => {
    showToast("⚠️ Tidak bisa salin otomatis. Coba di Chrome Android.");
  });
}

function closeReceipt() {
  document.getElementById("receiptOverlay").style.display = "none";
  render();
}

// ── Toast ──
let _toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove("show"), 3500);
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
if (!navigator.bluetooth) {
  document.getElementById("btBtn").style.display = "none";
} else {
  // Auto-reconnect after short delay (allows page to settle)
  setTimeout(btAutoConnect, 800);
}

render();
</script>
</body>
</html>
