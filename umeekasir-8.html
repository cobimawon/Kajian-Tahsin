      <div class="pb-card">
        <div class="pb-card-label">TOTAL OMZET</div>
        <div class="pb-card-val green">${fmt(omzetTotal)}</div>
      </div>
      <div class="pb-card">
        <div class="pb-card-label">PELANGGAN</div>
        <div class="pb-card-val green">${pelanggans.length}</div>
      </div>
      <div class="pb-card" style="display:flex;align-items:center;justify-content:center">
        <button class="pb-export-btn" style="width:100%;padding:10px 0;font-size:12px;border-radius:9px"

      <button class="pb-tab-btn ${pbSubTab==='transaksi'?'active':''}" onclick="setPbTab('transaksi')">📋 Transaksi</button>
      <button class="pb-tab-btn ${pbSubTab==='pelanggan'?'active':''}" onclick="setPbTab('pelanggan')">👥 Pelanggan</button>
    </div>

    ${pbSubTab === "transaksi" ? renderTrxList(trx) : renderPelangganList(pelanggans)}
  `;
}

function setPbTab(tab) { pbSubTab = tab; renderPembukuan(); }

function renderTrxList(trx) {
  if (!trx.length) return `<div class="pb-empty">📭 Belum ada transaksi tersimpan.<br>Selesaikan pembayaran untuk mencatat.</div>`;

// ── Export ke XLS ──
function exportXLS() {
  const trx = loadTrx();
  if (!trx.length) { showToast("⚠️ Belum ada data transaksi"); return; }

  const wb = XLSX.utils.book_new();

  // ── Sheet 1: Transaksi ──
  const trxRows = [
    ["No.Struk","Tanggal","Jam","Pemesan","Metode Bayar","Subtotal","Diskon","Total","Bayar","Kembalian","Jml Item","Item Detail"]
  ];
  trx.forEach(t => {
    const itemDetail = t.items.map(i=>`${i.name} x${i.qty}`).join("; ");
    trxRows.push([
      t.inv, t.dateStr, t.timeStr,
      t.nama && t.nama!=="—" ? t.nama : "—",
      t.pm, t.sub, t.disc||0, t.tot,
      t.paidAmt||t.tot, t.chg||0, t.qty, itemDetail
    ]);
  });
  // Baris total
  trxRows.push([]);
  trxRows.push(["","","","","TOTAL","","",trx.reduce((s,t)=>s+t.tot,0),"","","",""]);

  const ws1 = XLSX.utils.aoa_to_sheet(trxRows);
  // Lebar kolom
  ws1["!cols"] = [
    {wch:12},{wch:20},{wch:10},{wch:18},{wch:14},
    {wch:14},{wch:10},{wch:14},{wch:14},{wch:12},{wch:8},{wch:40}
  ];
  XLSX.utils.book_append_sheet(wb, ws1, "Transaksi");

  // ── Sheet 2: Ringkasan per Hari ──
  const byDay = {};
  trx.forEach(t => {
    if (!byDay[t.dateStr]) byDay[t.dateStr] = { omzet:0, trxCount:0, tunai:0, transfer:0, qris:0 };
    byDay[t.dateStr].omzet    += t.tot;
    byDay[t.dateStr].trxCount += 1;
    if (t.pm==="Tunai")    byDay[t.dateStr].tunai    += t.tot;
    if (t.pm==="Transfer") byDay[t.dateStr].transfer += t.tot;
    if (t.pm==="QRIS")     byDay[t.dateStr].qris     += t.tot;
  });
  const hariRows = [["Tanggal","Jml Transaksi","Total Omzet","Tunai","Transfer","QRIS"]];
  Object.entries(byDay).forEach(([d,v]) => {
    hariRows.push([d, v.trxCount, v.omzet, v.tunai, v.transfer, v.qris]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(hariRows);
  ws2["!cols"] = [{wch:22},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws2, "Per Hari");

  // ── Sheet 3: Ringkasan per Bulan ──
  const byMonth = {};
  trx.forEach(t => {
    const d = new Date(t.ts);
    const key = d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
    if (!byMonth[key]) byMonth[key] = { omzet:0, trxCount:0 };
    byMonth[key].omzet    += t.tot;
    byMonth[key].trxCount += 1;
  });
  const bulanRows = [["Bulan","Jml Transaksi","Total Omzet"]];
  Object.entries(byMonth).forEach(([m,v]) => {
    bulanRows.push([m, v.trxCount, v.omzet]);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(bulanRows);
  ws3["!cols"] = [{wch:22},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws3, "Per Bulan");

  // ── Sheet 4: Data Pelanggan ──
  const pelanggans = loadPelanggan();
  const pelRows = [["Nama Pelanggan","Jml Kunjungan","Total Belanja","Kunjungan Terakhir"]];
  [...pelanggans].sort((a,b)=>b.totalBelanja-a.totalBelanja).forEach(p => {
    pelRows.push([p.nama, p.kunjungan, p.totalBelanja, p.lastVisit]);
  });
  const ws4 = XLSX.utils.aoa_to_sheet(pelRows);
  ws4["!cols"] = [{wch:22},{wch:14},{wch:14},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws4, "Pelanggan");

  // Download
  const fileName = `Umee-Bakehouse-${new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"}).replace(/\//g,"-")}.xlsx`;
  XLSX.writeFile(wb, fileName);
  showToast("✅ File Excel berhasil diunduh!");
}

function clearTrx() {
  if (!confirm("Hapus semua data transaksi? Data pelanggan tetap tersimpan.")) return;
  localStorage.removeItem(TRX_KEY);
  renderPembukuan();
  showToast("🗑️ Riwayat transaksi dihapus");
}

// AUTOCOMPLETE NAMA PEMESAN
// ══════════════════════════════════════════════════════
function openNamaDropdown() {
  const pelanggans = loadPelanggan();
  const dd = document.getElementById("namaDropdown");
  if (!dd) return;
  if (!pelanggans.length) return; // tidak ada data, biarkan ketik manual

  // Bangun dropdown SEKALI — search input + list container terpisah
  const q = (document.getElementById("namaInp")?.value || "").toLowerCase();
  dd.innerHTML = `
    <div class="nama-search-wrap">
      <span class="nama-search-icon">🔍</span>
      <input class="nama-search-inp" id="namaSearchInp"
        placeholder="Cari nama pelanggan..."
        value="${q}"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"/>
    </div>
    <div id="namaOptList"></div>`;

  dd.style.display = "block";

  // Isi list awal
  updateNamaList(pelanggans, q);

  // Event: ketik di search input — hanya update list, TIDAK rebuild dropdown
  const si = document.getElementById("namaSearchInp");
  si.addEventListener("input", () => {
    const val = si.value;
    namaPemesan = val;
    const namaInp = document.getElementById("namaInp");
    if (namaInp) namaInp.value = val;
    updateNamaList(loadPelanggan(), val.toLowerCase());
  });

  // Fokus ke search input (tunda sedikit agar DOM siap)
  requestAnimationFrame(() => {
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  });

  // Tutup saat klik di luar
  setTimeout(() => {
    document.addEventListener("click", closeNamaDropdownOutside, { once: true });
  }, 0);
}

// Hanya update bagian list — search input TIDAK disentuh
function updateNamaList(pelanggans, q) {
  const listEl = document.getElementById("namaOptList");
  if (!listEl) return;

  const filtered = q
    ? pelanggans.filter(p => p.nama.toLowerCase().includes(q))
    : [...pelanggans].sort((a,b) => b.kunjungan - a.kunjungan);

  if (!filtered.length) {
    listEl.innerHTML = `<div class="nama-empty">Pelanggan baru — ketik nama lalu lanjut</div>`;
  } else {
    listEl.innerHTML = filtered.slice(0, 8).map(p => `
      <div class="nama-opt" onclick="pilihNama('${p.nama.replace(/'/g,"\\'")}')">
        <div class="nama-opt-avatar">${p.nama.charAt(0).toUpperCase()}</div>
        <div class="nama-opt-info">
          <div class="nama-opt-nama">${highlightMatch(p.nama, q)}</div>
          <div class="nama-opt-meta">${p.kunjungan}× kunjungan · ${fmt(p.totalBelanja)}</div>
        </div>
      </div>`).join("");
  }
}

function closeNamaDropdownOutside(e) {
  const wrap = document.getElementById("namaWrap");
  if (wrap && !wrap.contains(e.target)) {
    closeNamaDropdown();
  } else {
    document.addEventListener("click", closeNamaDropdownOutside, { once: true });
  }
}

function closeNamaDropdown() {
  const dd = document.getElementById("namaDropdown");
  if (dd) dd.style.display = "none";
}

// Dipanggil saat mengetik di namaInp utama (field atas)
function filterNamaDropdown(q) {
  const dd = document.getElementById("namaDropdown");
  const si = document.getElementById("namaSearchInp");
  if (!dd || dd.style.display === "none") {
    openNamaDropdown();
    return;
  }
  // Sync nilai ke search input dalam dropdown tanpa rebuild
  if (si && si.value !== q) si.value = q;
  updateNamaList(loadPelanggan(), q.toLowerCase());
}

function pilihNama(nama) {
  namaPemesan = nama;
  const inp = document.getElementById("namaInp");
  if (inp) inp.value = nama;
  closeNamaDropdown();
  showToast("✅ " + nama);
}

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return text;
  return text.slice(0, idx)
    + `<span style="color:#D4622A;font-weight:700">${text.slice(idx, idx+q.length)}</span>`
    + text.slice(idx+q.length);
}

  kmEditId = id;

  setTimeout(() => {

    if (area) area.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 50);
}

function cancelEditMenu() {
  kmEditId = null;
  kmEmoji  = "🍕";
  renderKM();
}

function saveMenuItem() {
  const name  = document.getElementById("kmName")?.value.trim();
  const price = parseInt(document.getElementById("kmPrice")?.value) || 0;
  if (!name)  { showToast("⚠️ Nama menu tidak boleh kosong"); return; }
  if (price <= 0) { showToast("⚠️ Harga harus lebih dari 0"); return; }

  const menu = getMenu();

  if (kmEditId !== null) {
    // Edit existing
    const idx = menu.findIndex(m => m.id === kmEditId);
    if (idx >= 0) {
      menu[idx] = { ...menu[idx], name, price, emoji: kmEmoji };
      showToast("✅ Menu diperbarui: " + name);
    }
    kmEditId = null;
  } else {
    // Tambah baru
    const newId = Math.max(0, ...menu.map(m => m.id)) + 1;
    menu.push({ id: newId, name, price, emoji: kmEmoji });
    showToast("✅ Menu ditambahkan: " + name);
  }

  saveMenu(menu);
  MENU = menu;
  kmEmoji = "🍕";
  renderKM();
  renderMenu();
}

function deleteMenu(id) {
  const menu = getMenu();
  const item = menu.find(m => m.id === id);
  if (!item) return;
  if (!confirm(`Hapus "${item.name}" dari menu?`)) return;
  const newMenu = menu.filter(m => m.id !== id);
  // Hapus dari cart juga jika ada
  cart = cart.filter(c => c.id !== id);
  saveMenu(newMenu);
  MENU = newMenu;
  renderKM();
  renderMenu();
  renderFooter();
  showToast("🗑️ " + item.name + " dihapus");
}

function previewStruk() {
  const el = document.getElementById("stPreview");
  if (!el) return;
  const nama     = document.getElementById("stNamaT")?.value || "Nama Toko";
  const tagline  = document.getElementById("stTagline")?.value || "";
  const telp     = document.getElementById("stTelp")?.value || "";

  const ig       = document.getElementById("stIG")?.value || "";

  const ucapan2  = document.getElementById("stUcapan2")?.value || "";
  const catatan  = document.getElementById("stCatatan")?.value || "";
  const showTag  = document.getElementById("stShowTagline")?.checked;
  const showTelp = document.getElementById("stShowTelp")?.checked;
  const showAl   = document.getElementById("stShowAlamat")?.checked;
  const showIG   = document.getElementById("stShowIG")?.checked;
  const showCat  = document.getElementById("stShowCatatan")?.checked;
  const emoji    = _stEmojiSelected || "🥐";

  let lines = [];
  lines.push(`${emoji} ${nama}`);
  if (showTag && tagline) lines.push(tagline);
  if (showTelp && telp)   lines.push(`Telp: ${telp}`);
  if (showAl && alamat)   lines.push(alamat);
  lines.push("──────────────");
  lines.push("... item pesanan ...");
  lines.push("──────────────");
  lines.push(ucapan1 || "Terimakasih");
  if (ucapan2) lines.push(ucapan2);
  if (showIG && ig)   lines.push(`IG: @${ig}`);

  el.textContent = lines.join("\n");

function previewQrisKode() {
  const kode = document.getElementById("stQrisStatic")?.value.trim();
  const previewEl = document.getElementById("stQrisPreview");
  if (!previewEl) return;

  const src = kode || QRIS_STATIC_DEFAULT;
  if (!src.startsWith("000201")) {
    previewEl.innerHTML = `<div style="color:#e44;font-size:12px;padding:8px">⚠️ Kode tidak valid. Kode QRIS harus dimulai dengan "000201".</div>`;
    return;
  }

  previewEl.innerHTML = `<div style="font-size:11px;color:#aaa;margin-bottom:8px">Pratinjau QR (statis, tanpa nominal):</div>`;
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:inline-block;padding:8px;border:2px solid #1C1C1C;border-radius:6px;background:#fff";
  previewEl.appendChild(wrap);

  try {
    new QRCode(wrap, { text: src, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });
    previewEl.insertAdjacentHTML("beforeend", `<div style="font-size:11px;color:#1C7A55;margin-top:8px">✅ Kode valid · ${src.length} karakter</div>`);
  } catch(e) {
    previewEl.innerHTML = `<div style="color:#e44;font-size:12px;padding:8px">❌ Gagal buat QR: ${e.message}</div>`;
  }
}

let _stLogoData = ""; // base64 sementara selama modal terbuka

function handleLogoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    showToast("⚠️ File terlalu besar. Maks 2MB.");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    // Resize ke max 300x200 via canvas sebelum simpan
    const img = new Image();
    img.onload = () => {
      const MAX_W = 300, MAX_H = 200;
      let w = img.width, h = img.height;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      _stLogoData = canvas.toDataURL("image/png");
      // Update preview langsung
      const area = document.getElementById("logoUploadArea");
      if (area) area.innerHTML = `
        <img src="${_stLogoData}" class="logo-preview-img" alt="Logo"/>
        <div class="logo-upload-hint">Tap untuk ganti logo</div>`;
      // Tampilkan tombol hapus
      const hint = area?.nextElementSibling?.nextElementSibling;
      let removeBtn = document.querySelector(".logo-remove-btn");
      if (!removeBtn) {
        removeBtn = document.createElement("button");
        removeBtn.className = "logo-remove-btn";
        removeBtn.textContent = "🗑️ Hapus Logo";
        removeBtn.onclick = removeLogo;
        area?.parentNode.insertBefore(removeBtn, area.nextSibling.nextSibling);
      }
      showToast("✅ Logo berhasil diunggah");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  _stLogoData = "__REMOVE__";
  const area = document.getElementById("logoUploadArea");
  const ST = loadSettings();
  if (area) area.innerHTML = `
    <div style="font-size:36px;margin-bottom:4px">${ST.emoji}</div>
    <div class="logo-upload-hint">Tap untuk upload logo PNG/JPG</div>`;
  const removeBtn = document.querySelector(".logo-remove-btn");
  if (removeBtn) removeBtn.remove();
}

function saveSettingsForm() {
  const logoFinal = _stLogoData === "__REMOVE__" ? "" : (_stLogoData || loadSettings().logoData || "");
  const ST = {
    namaT    : document.getElementById("stNamaT")?.value.trim()    || "Umee! Bakehouse",
    subT     : document.getElementById("stSubT")?.value.trim()     || "Point of Sale",
    emoji    : _stEmojiSelected || "🥐",
    tagline  : document.getElementById("stTagline")?.value.trim()  || "",
    telp     : document.getElementById("stTelp")?.value.trim()     || "",
    alamat   : document.getElementById("stAlamat")?.value.trim()   || "",
    ig       : document.getElementById("stIG")?.value.trim()       || "",
    ucapan1  : document.getElementById("stUcapan1")?.value.trim()  || "Terimakasih",
    ucapan2  : document.getElementById("stUcapan2")?.value.trim()  || "",
    catatan  : document.getElementById("stCatatan")?.value.trim()  || "",
    logoData : logoFinal,
    qrisStatic : document.getElementById("stQrisStatic")?.value.trim() || "",
    showTagline : document.getElementById("stShowTagline")?.checked  ?? true,
    showTelp    : document.getElementById("stShowTelp")?.checked     ?? true,
    showAlamat  : document.getElementById("stShowAlamat")?.checked   ?? false,
    showIG      : document.getElementById("stShowIG")?.checked       ?? true,
    showCatatan : document.getElementById("stShowCatatan")?.checked  ?? false,
  };
  saveSettings(ST);
  applySettingsToUI(ST);
  _stLogoData = "";
  closeSettings();
  showToast("✅ Pengaturan disimpan!");
}

function applySettingsToUI(ST) {
  const s = ST || loadSettings();
  // Header
  const hEmoji = document.getElementById("headerEmoji");
  const hTitle = document.getElementById("headerTitle");
  const hSub   = document.getElementById("headerSub");
  if (hEmoji) hEmoji.textContent = s.emoji;
  if (hTitle) hTitle.textContent = s.namaT;
  if (hSub)   hSub.textContent   = s.subT;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast("📋 Struk disalin! Paste ke WA atau pesan lainnya.");
  }).catch(() => {
    showToast("⚠️ Tidak bisa salin otomatis. Coba di Chrome Android.");
  });
}

function closeReceipt() {
  document.getElementById("receiptOverlay").style.display = "none";
  render();
}

// ── Toast ──
let _toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove("show"), 3500);
}

if (!navigator.bluetooth) {
  document.getElementById("btBtn").style.display = "none";
